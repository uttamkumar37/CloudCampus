spring:
  application:
    name: cloudcampus-backend
  datasource:
    url: ${CLOUDCAMPUS_JDBC_URL:jdbc:h2:mem:cloudcampus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: ${CLOUDCAMPUS_JDBC_DRIVER:org.h2.Driver}
    username: ${CLOUDCAMPUS_JDBC_USERNAME:sa}
    password: ${CLOUDCAMPUS_JDBC_PASSWORD:}
  flyway:
    enabled: true
  mail:
    host: ${CLOUDCAMPUS_SMTP_HOST:}
    port: ${CLOUDCAMPUS_SMTP_PORT:587}
    username: ${CLOUDCAMPUS_SMTP_USERNAME:}
    password: ${CLOUDCAMPUS_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${CLOUDCAMPUS_SMTP_AUTH:true}
          starttls:
            enable: ${CLOUDCAMPUS_SMTP_STARTTLS:true}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

cloudcampus:
  auth:
    jwt-secret: ${CLOUDCAMPUS_AUTH_JWT_SECRET:dev-only-cloudcampus-auth-token-secret-change-me}
    access-token-ttl-minutes: ${CLOUDCAMPUS_AUTH_ACCESS_TOKEN_TTL_MINUTES:60}
  cors:
    allowed-origins: ${CLOUDCAMPUS_CORS_ALLOWED_ORIGINS:}
  notifications:
    email:
      mode: ${CLOUDCAMPUS_EMAIL_MODE:log}
      from: ${CLOUDCAMPUS_EMAIL_FROM:no-reply@cloudcampus.local}
      app-base-url: ${CLOUDCAMPUS_APP_BASE_URL:http://localhost:8080}
      allow-log-mode-in-production: ${CLOUDCAMPUS_ALLOW_LOG_EMAIL_IN_PRODUCTION:false}
