name: CloudCampus CI

on:
  push:
    branches:
      - main
      - master
      - project-redesign
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudcampus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn -B test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run mobile lint
        working-directory: mobile
        run: npm run lint

      - name: Run mobile typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

  ops:
    name: Ops
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate ops scaffold
        run: sh scripts/ci/validate-ops.sh

      - name: Validate staging compose
        run: docker compose -f infra/docker/local/compose.staging.yml config

      - name: Validate deployment compose files
        run: |
          docker compose --env-file .env.example -f docker-compose.local.yml config
          docker compose --env-file .env.staging.example -f docker-compose.staging.yml config
          docker compose --env-file .env.production.example -f docker-compose.prod.yml config

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run dependency audit gates
        run: sh scripts/ci/security-audit.sh
