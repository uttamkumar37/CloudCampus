name: CI

# ─────────────────────────────────────────────────────────────────────────────
# CI — Fast required checks (developer-friendly)
#
# Runs on every push and every pull-request so developers get fast feedback
# in seconds-to-low-minutes. Only the four jobs below are required for branch
# protection:
#
#   1. backend   — compile + Testcontainers tests
#   2. frontend  — TypeScript + Vite production build
#   3. mobile    — TypeScript check
#   4. secret-scan — TruffleHog scan
#
# Heavy jobs that previously slowed every push (OWASP Dependency-Check,
# Docker image build + Trivy CVE scan) have been moved to:
#
#   • .github/workflows/security-nightly.yml — schedule + main + workflow_dispatch
#   • .github/workflows/docker-publish.yml   — main + release + workflow_dispatch
#
# Rationale: developers should not pay a 5-minute OWASP penalty on a typo fix,
# and feature branches should not push images to GHCR.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - '**'         # Every branch, so devs see status before opening a PR.
    tags-ignore:
      - '**'         # Tag pushes are handled by docker-publish.yml.
  pull_request:
    branches:
      - main
      - 'release/**'

# Cancel in-flight runs for the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 — Backend: compile, test (Testcontainers), package
  # Required check for branch protection.
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and run tests
        working-directory: backend
        run: mvn verify --batch-mode --no-transfer-progress

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 — Frontend: TypeScript + Vite production build
  # Required check for branch protection.
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — TypeScript & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check + Vite build
        working-directory: frontend
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # (Removed) Job 3 — Mobile: TypeScript check
  #   The React Native mobile app was removed from the repo; native mobile is
  #   planned for a future release and will be rebuilt fresh. Restore a job
  #   here when that work begins. The backend mobile API namespace
  #   (/v1/mobile/*) is unaffected and lives in the backend job.
  # ────────────────────────────────────────────────────────────────────────────

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3 — Secret scan: TruffleHog
  # Required check for branch protection.
  # Fast (< 60 s) and catches accidental commits of credentials.
  # ────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan — TruffleHog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for diff scan)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: TruffleHog — scan commits in this push/PR
        run: |
          # Determine the base commit to diff from.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # Fall back to scanning just HEAD if BASE is unavailable (first push).
          [ -z "$BASE" ] && BASE="HEAD~1"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/pwd" \
            ghcr.io/trufflesecurity/trufflehog:3.90.2 \
            git file:///pwd \
            --since-commit "$BASE" \
            --only-verified \
            --fail
