name: CloudCampus Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Image tag to build/deploy. Defaults to the workflow commit SHA when blank.
        required: false
        type: string
      push_images:
        description: Push images to GitHub Container Registry
        required: true
        default: true
        type: boolean
      deploy:
        description: Deploy after image build. Requires target environment secrets.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: cloudcampus-deploy-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-images:
    name: Build and scan Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image names
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          image_tag="${{ inputs.image_tag }}"
          if [ -z "$image_tag" ]; then
            image_tag="${GITHUB_SHA}"
          fi
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${repository}/backend:${image_tag}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${repository}/frontend:${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: inputs.push_images
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t "${{ steps.meta.outputs.backend_image }}" .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t "${{ steps.meta.outputs.frontend_image }}" .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.backend_image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.frontend_image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Push backend image
        if: inputs.push_images
        run: docker push "${{ steps.meta.outputs.backend_image }}"

      - name: Push frontend image
        if: inputs.push_images
        run: docker push "${{ steps.meta.outputs.frontend_image }}"

  deploy-staging:
    name: Deploy to staging
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.deploy && inputs.environment == 'staging'
    environment: staging
    env:
      BACKEND_IMAGE: ${{ needs.build-images.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.build-images.outputs.frontend_image }}
      SSH_HOST: ${{ secrets.STAGING_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
      BASE_URL: ${{ secrets.STAGING_BASE_URL }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/cloudcampus
          chmod 600 ~/.ssh/cloudcampus
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy compose stack
        shell: bash
        run: |
          set -euo pipefail
          remote_path="${DEPLOY_PATH:-/opt/cloudcampus}"
          ssh -i ~/.ssh/cloudcampus "$SSH_USER@$SSH_HOST" \
            "cd '$remote_path' && \
             DEPLOY_ENV=staging \
             APP_DIR='$remote_path' \
             CLOUDCAMPUS_BACKEND_IMAGE='$BACKEND_IMAGE' \
             CLOUDCAMPUS_FRONTEND_IMAGE='$FRONTEND_IMAGE' \
             RUN_SMOKE=false \
             sh infra/scripts/ec2-deploy-compose.sh"

      - name: Verify staging health
        if: env.BASE_URL != ''
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/actuator/health"
          curl -fsS "$BASE_URL/actuator/health/readiness"
          curl -fsS "$BASE_URL/"

  deploy-production:
    name: Deploy to production
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.deploy && inputs.environment == 'production'
    environment: production
    env:
      BACKEND_IMAGE: ${{ needs.build-images.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.build-images.outputs.frontend_image }}
      SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
      SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/cloudcampus
          chmod 600 ~/.ssh/cloudcampus
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy compose stack
        shell: bash
        run: |
          set -euo pipefail
          remote_path="${DEPLOY_PATH:-/opt/cloudcampus}"
          ssh -i ~/.ssh/cloudcampus "$SSH_USER@$SSH_HOST" \
            "cd '$remote_path' && \
             DEPLOY_ENV=production \
             APP_DIR='$remote_path' \
             CLOUDCAMPUS_BACKEND_IMAGE='$BACKEND_IMAGE' \
             CLOUDCAMPUS_FRONTEND_IMAGE='$FRONTEND_IMAGE' \
             RUN_SMOKE=false \
             sh infra/scripts/ec2-deploy-compose.sh"

      - name: Verify production health
        if: env.BASE_URL != ''
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/actuator/health"
          curl -fsS "$BASE_URL/actuator/health/readiness"
          curl -fsS "$BASE_URL/"
