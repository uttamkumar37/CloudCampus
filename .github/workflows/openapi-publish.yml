name: OpenAPI — Publish Spec

# ─────────────────────────────────────────────────────────────────────────────
# Boots the backend with the dev profile (which enables springdoc), pulls
# /v3/api-docs, and publishes the resulting openapi.json as a workflow artifact.
#
# Optionally pushes to the `openapi-spec` branch so the latest spec is
# browsable at https://github.com/<owner>/<repo>/blob/openapi-spec/openapi.json
# and can be consumed by Postman, Redocly, downstream SDK generators, etc.
#
# Not a required check — runs on push to main and on demand.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Generate & publish openapi.json
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cloudcampus
          POSTGRES_USER: cloudcampus
          POSTGRES_PASSWORD: cloudcampus_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cloudcampus
      SPRING_DATASOURCE_USERNAME: cloudcampus
      SPRING_DATASOURCE_PASSWORD: cloudcampus_dev
      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: '6379'
      JWT_SECRET: openapi-publish-only-jwt-secret-min-32-chars-padding-x
      # Springdoc enabled regardless of profile for this CI run.
      SPRINGDOC_API_DOCS_ENABLED: 'true'
      SPRINGDOC_SWAGGER_UI_ENABLED: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build backend (skip tests — they ran in ci.yml)
        working-directory: backend
        run: mvn package -DskipTests --batch-mode --no-transfer-progress

      - name: Start backend in background
        working-directory: backend
        run: |
          # shellcheck disable=SC2086
          nohup java -jar target/*.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for /actuator/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend is up (after ${i}s)"; exit 0
            fi
            sleep 1
          done
          echo "Backend did not come up in 60s; printing last log lines:"
          tail -200 backend/app.log
          exit 1

      - name: Fetch OpenAPI spec
        run: |
          curl -fsS http://localhost:8080/v3/api-docs > openapi.json
          # Pretty-print so diffs are reviewable
          python3 -m json.tool openapi.json > openapi.pretty.json
          mv openapi.pretty.json openapi.json
          wc -c openapi.json

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend/app.pid ]; then
            kill "$(cat backend/app.pid)" 2>/dev/null || true
          fi

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-spec
          path: openapi.json
          retention-days: 90

      # ────────────────────────────────────────────────────────────────────────
      # Push to a long-lived `openapi-spec` branch so the latest spec is
      # browsable from a stable URL. Only runs on main; uses the workflow
      # GITHUB_TOKEN so no extra secrets needed.
      # ────────────────────────────────────────────────────────────────────────
      - name: Publish to openapi-spec branch (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Worktree on a fresh orphan branch so we don't carry source history.
          git worktree add -B openapi-spec /tmp/openapi-spec || \
            git worktree add /tmp/openapi-spec openapi-spec
          cp openapi.json /tmp/openapi-spec/openapi.json
          cd /tmp/openapi-spec
          if git status --porcelain | grep -q .; then
            git add openapi.json
            git commit -m "openapi: update from ${GITHUB_SHA::7}"
            git push --force-with-lease origin openapi-spec
          else
            echo "OpenAPI spec unchanged; nothing to push."
          fi
