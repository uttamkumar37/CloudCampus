name: Security — Nightly Scans

# ─────────────────────────────────────────────────────────────────────────────
# Heavy security scans that are NOT required on every developer push.
#
# Why this is its own workflow:
#   OWASP Dependency-Check downloads the NVD database (~200 MB) and runs for
#   3-5 minutes per build. Running it on every push and PR slows developer
#   feedback and burns CI minutes for no signal — CVEs in dependencies don't
#   appear faster than nightly.
#
#   Trivy container scan needs a built image and is only meaningful against
#   what we'd actually ship.
#
# Triggers (intentionally NOT including push to feature branches):
#   • schedule          — runs every night at 02:00 UTC
#   • workflow_dispatch — on-demand manual run for any release/security review
#   • push to main       — keeps the green-on-main invariant
#   • push to release/** — release branch hardening
#
# Branch protection: this workflow is NOT a required check. It alerts the
# team but does not block PR merges.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cloudcampus-backend

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # OWASP Dependency-Check — CVE scan of Maven dependencies.
  # ────────────────────────────────────────────────────────────────────────────
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: OWASP dependency-check (report CVSS >= 7)
        continue-on-error: true   # Report-only while remediation train is in flight.
        working-directory: backend
        run: |
          mvn org.owasp:dependency-check-maven:10.0.4:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionsFile=.owasp-suppressions.xml \
            --batch-mode --no-transfer-progress

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owasp-dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Trivy — container image scan.
  #
  # Pulls the most recently published `:latest` from GHCR and scans it.
  # If you want to scan a specific tag, run this workflow manually via
  # workflow_dispatch and use input `image_tag` (set to e.g. v1.4.2).
  # ────────────────────────────────────────────────────────────────────────────
  container-scan:
    name: Trivy — Container CVE scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR (read-only)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan (HIGH + CRITICAL, ignore unfixed)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e TRIVY_USERNAME=${{ github.actor }} \
            -e TRIVY_PASSWORD=${{ secrets.GITHUB_TOKEN }} \
            aquasec/trivy:0.61.0 image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "$IMAGE"
