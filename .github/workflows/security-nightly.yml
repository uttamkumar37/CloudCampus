name: Security — Release Gate

# ─────────────────────────────────────────────────────────────────────────────
# Security scans that must block release-bound changes.
#
# Why this is its own workflow:
#   OWASP Dependency-Check downloads the NVD database (~200 MB) and runs for
#   several minutes. Keeping it out of fast CI preserves developer feedback
#   while still requiring it before code can merge to protected branches.
#
#   Trivy is run against a freshly-built backend image for the current ref, so
#   PRs are blocked by the image they would actually ship instead of a stale
#   GHCR :latest tag.
#
# Triggers:
#   • pull_request      — release gate; configure as required in branch rules
#   • schedule          — runs every night at 02:00 UTC
#   • workflow_dispatch — on-demand manual run for any release/security review
#   • push to main       — keeps the green-on-main invariant
#   • push to release/** — release branch hardening
#
# Branch protection: require both jobs from this workflow:
#   • OWASP Dependency Check
#   • Trivy — Backend image CVE scan
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: cloudcampus-backend:${{ github.sha }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # OWASP Dependency-Check — CVE scan of Maven dependencies.
  # ────────────────────────────────────────────────────────────────────────────
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: OWASP dependency-check (block CVSS >= 7)
        working-directory: backend
        run: |
          mvn org.owasp:dependency-check-maven:10.0.4:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionsFile=.owasp-suppressions.xml \
            --batch-mode --no-transfer-progress

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owasp-dependency-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Trivy — container image scan.
  #
  # Builds the backend image for the current ref and scans that local image.
  # ────────────────────────────────────────────────────────────────────────────
  container-scan:
    name: Trivy — Backend image CVE scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Package backend JAR
        working-directory: backend
        run: mvn package -DskipTests --batch-mode --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build backend image for scan
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (HIGH + CRITICAL, ignore unfixed)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.61.0 image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "${{ env.BACKEND_IMAGE }}"
