# CloudCampus frontend — nginx config (matches frontend/Dockerfile stage 2).
#
# Why port 8080 (not 80)? Running as a non-root user inside the container
# (USER nginx) cannot bind to ports < 1024. Kubernetes / docker-compose
# can map 80→8080 at the ingress layer.

server {
    listen       8080 default_server;
    listen       [::]:8080 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Probes ─────────────────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── Static assets fingerprinted by Vite — safe to cache forever ────────
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ── Service worker / manifest — short cache so app updates land quickly ─
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files  $uri =404;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────
    location / {
        # index.html itself is never cached so deploys are immediate.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files  $uri $uri/ /index.html;
    }

    # Mirror the backend security headers so the FE response is consistent
    # with the API response. Adjust CSP for any new CDN / analytics domains.
    add_header X-Frame-Options       "DENY"           always;
    add_header X-Content-Type-Options "nosniff"        always;
    add_header Referrer-Policy       "no-referrer"    always;
    add_header Permissions-Policy    "geolocation=(), microphone=(), camera=()" always;
}
