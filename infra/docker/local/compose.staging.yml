services:
  backend:
    build:
      context: ../../..
      dockerfile: backend/Dockerfile
    env_file:
      - ../../env/staging.example.env
    environment:
      CLOUDCAMPUS_JDBC_URL: ${CLOUDCAMPUS_JDBC_URL:-jdbc:h2:mem:cloudcampus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
      CLOUDCAMPUS_JDBC_DRIVER: ${CLOUDCAMPUS_JDBC_DRIVER:-org.h2.Driver}
      CLOUDCAMPUS_JDBC_USERNAME: ${CLOUDCAMPUS_JDBC_USERNAME:-sa}
      CLOUDCAMPUS_JDBC_PASSWORD: ${CLOUDCAMPUS_JDBC_PASSWORD:-}
      CLOUDCAMPUS_EMAIL_MODE: ${CLOUDCAMPUS_EMAIL_MODE:-log}
      CLOUDCAMPUS_APP_BASE_URL: ${CLOUDCAMPUS_APP_BASE_URL:-http://localhost:8088}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ../../..
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
