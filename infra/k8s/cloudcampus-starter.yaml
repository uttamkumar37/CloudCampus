apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcampus-backend
  labels:
    app: cloudcampus-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudcampus-backend
  template:
    metadata:
      labels:
        app: cloudcampus-backend
    spec:
      containers:
        - name: backend
          image: cloudcampus/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
          envFrom:
            - secretRef:
                name: cloudcampus-backend-secrets
            - configMapRef:
                name: cloudcampus-backend-config
---
apiVersion: v1
kind: Service
metadata:
  name: cloudcampus-backend
spec:
  selector:
    app: cloudcampus-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudcampus-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudcampus-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
