# CloudCampus host Nginx reverse proxy template.
# Install as /etc/nginx/conf.d/cloudcampus.conf after replacing server_name and cert paths.

limit_req_zone $binary_remote_addr zone=cloudcampus_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cloudcampus_api:10m rate=120r/m;

upstream cloudcampus_frontend {
    server 127.0.0.1:18088;
}

upstream cloudcampus_backend {
    server 127.0.0.1:18080;
}

server {
    listen 80;
    server_name app.cloudcampus.example;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.cloudcampus.example;

    ssl_certificate /etc/letsencrypt/live/app.cloudcampus.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.cloudcampus.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /actuator/health {
        proxy_pass http://cloudcampus_backend;
    }

    location = /actuator/health/readiness {
        proxy_pass http://cloudcampus_backend;
    }

    location ~ ^/v1/auth/(login|mfa|refresh|password|forgot-password|reset-password) {
        limit_req zone=cloudcampus_auth burst=20 nodelay;
        proxy_pass http://cloudcampus_backend;
    }

    location /v1/ {
        limit_req zone=cloudcampus_api burst=240 nodelay;
        proxy_pass http://cloudcampus_backend;
    }

    location / {
        proxy_pass http://cloudcampus_frontend;
    }
}
